<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Olcay Gym Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0e0e0e;font-family:-apple-system,system-ui,sans-serif;color:#fff;min-height:100vh;max-width:480px;margin:0 auto;}
.screen{display:none;}.screen.active{display:block;}
.home-hdr{padding:36px 20px 18px;border-bottom:1px solid #1a1a1a;}
.home-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;color:#444;text-transform:uppercase;margin-bottom:5px;}
.home-title{font-size:28px;font-weight:800;letter-spacing:-.6px;}
.home-brands{font-size:12px;color:#333;margin-top:4px;}
.day-list{padding:16px 14px 40px;}
.day-card{background:#141414;border:1px solid #1e1e1e;border-left-width:3px;border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.day-card:active{background:#1c1c1c;}
.day-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;letter-spacing:.06em;display:inline-block;margin-bottom:5px;}
.day-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.day-info{font-size:11px;color:#444;}
.day-arrow{font-size:22px;color:#252525;flex-shrink:0;}
.day-hdr{background:#111;border-bottom:1px solid #1a1a1a;padding:14px 16px 12px;position:sticky;top:0;z-index:20;}
.back-btn{background:#1e1e1e;border:none;color:#888;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:9px;display:inline-block;}
.day-hdr-title{font-size:21px;font-weight:800;letter-spacing:-.3px;}
.day-hdr-sub{font-size:12px;color:#444;margin-top:2px;}
.ex-list{padding:12px 12px 8px;}
.osgood-box{background:#1a1000;border-left:3px solid #c8860a;border-radius:10px;padding:10px 13px;font-size:12px;color:#c8860a;line-height:1.65;margin-bottom:12px;}
.ex-card{background:#141414;border:1px solid #1e1e1e;border-radius:14px;margin-bottom:10px;overflow:hidden;}
.ex-hdr{padding:13px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;}
.ex-num{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.ex-num span{font-size:11px;font-weight:800;color:#fff;}
.ex-main{flex:1;min-width:0;}
.ex-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.ex-name{font-size:14px;font-weight:700;line-height:1.35;flex:1;min-width:0;word-break:break-word;}
.edit-name-btn{background:none;border:none;color:#2a2a2a;font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1;}
.del-ex-btn{background:none;border:none;color:#2a2a2a;font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1;}
.ex-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ex-sets{font-size:13px;font-weight:800;}
.ex-rir{font-size:11px;color:#444;}
.ex-brand-pill{font-size:10px;font-weight:600;background:#1a1a1a;padding:2px 7px;border-radius:5px;}
.ex-note-prev{margin-top:6px;font-size:12px;color:#5dbf5d;background:#0b240b;border-radius:6px;padding:4px 8px;}
.ex-chev{color:#252525;font-size:22px;flex-shrink:0;line-height:1;transition:transform .2s;}
.ex-chev.open{transform:rotate(90deg);}
.ex-body{border-top:1px solid #1a1a1a;display:none;}
.ex-body.open{display:block;}
.machine-wrap{background:#0c0c0c;padding:0;position:relative;border-bottom:1px solid #1a1a1a;overflow:hidden;}
.machine-wrap .svgbox{padding:14px 0 6px;display:flex;justify-content:center;}
.machine-wrap .svgbox svg{max-width:280px;width:100%;}
.machine-wrap img.custom-img{width:100%;height:200px;object-fit:cover;display:block;}
.img-change-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);border:1px solid #333;color:#bbb;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.machine-label{text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;color:#2a2a2a;text-transform:uppercase;padding:4px 0 10px;}
.ex-tip{margin:12px 14px 0;font-size:12.5px;color:#999;line-height:1.7;background:#0f0f0f;border-radius:9px;padding:11px 13px;border-left:3px solid #2a2a2a;}
.note-sec{padding:12px 14px 15px;}
.note-lbl{font-size:10px;font-weight:700;color:#3a3a3a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.note-disp{background:#0f0f0f;border:1px dashed #222;border-radius:9px;padding:11px 13px;cursor:pointer;min-height:44px;display:flex;align-items:center;}
.note-disp.has{background:#0b220b;border-color:#1e4a1e;}
.note-ph{font-size:13px;color:#2a2a2a;}
.note-val{font-size:13px;color:#5dbf5d;}
.note-inp{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:9px;padding:11px 13px;font-size:13px;color:#fff;outline:none;font-family:inherit;margin-bottom:9px;}
.note-btns{display:flex;gap:8px;}
.save-btn{flex:1;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:9px;padding:11px;font-size:13px;color:#666;cursor:pointer;}
.name-edit-wrap{margin-bottom:4px;}
.name-edit-inp{width:100%;background:#0f0f0f;border:1px solid #444;border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;margin-bottom:6px;}
.name-edit-btns{display:flex;gap:6px;}
.name-save-btn{flex:1;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.name-cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:8px;padding:8px;font-size:12px;color:#666;cursor:pointer;font-family:inherit;}
.add-ex-area{margin:0 12px 40px;}
.add-ex-btn{width:100%;background:#141414;border:1px dashed #252525;border-radius:12px;padding:13px;font-size:13px;color:#2a2a2a;cursor:pointer;font-family:inherit;text-align:center;}
.add-ex-btn:active{background:#1c1c1c;}
.add-ex-form{background:#141414;border:1px solid #222;border-radius:12px;padding:14px;}
.add-form-title{font-size:11px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.add-inp{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:8px;padding:10px 12px;font-size:13px;color:#fff;outline:none;font-family:inherit;margin-bottom:8px;}
.add-inp::placeholder{color:#2a2a2a;}
.add-row{display:flex;gap:8px;margin-bottom:0;}
.add-row .add-inp{margin-bottom:8px;flex:1;}
.add-form-btns{display:flex;gap:8px;margin-top:4px;}
.add-confirm-btn{flex:1;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.add-cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:9px;padding:10px;font-size:13px;color:#666;cursor:pointer;font-family:inherit;}

/* ── Weight Tracker ─────────────────────────────────── */
.wt-section{padding:12px 14px 4px;}
.wt-lbl{font-size:10px;font-weight:700;color:#3a3a3a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.wt-pr{font-size:10px;font-weight:700;color:#f0a500;background:#1a1400;padding:2px 8px;border-radius:20px;}
.wt-sets{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.wt-set-row{display:flex;align-items:center;gap:6px;}
.wt-set-num{font-size:11px;font-weight:700;color:#333;width:18px;flex-shrink:0;text-align:center;}
.wt-inp{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;text-align:center;width:72px;flex-shrink:0;}
.wt-inp:focus{border-color:#444;}
.wt-unit{font-size:11px;color:#333;flex-shrink:0;}
.wt-x{font-size:13px;color:#2a2a2a;flex-shrink:0;}
.wt-rep-inp{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;text-align:center;width:52px;flex-shrink:0;}
.wt-rep-inp:focus{border-color:#444;}
.wt-rep-unit{font-size:11px;color:#333;flex-shrink:0;}
.wt-done-btn{margin-left:auto;background:#0a1f0a;border:1.5px solid #1a3a1a;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:#3a8a3a;cursor:pointer;flex-shrink:0;font-family:inherit;}
.wt-done-btn.done{background:#0b2a0b;border-color:#1D9E75;color:#1D9E75;}
.wt-save-btn{width:100%;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.wt-history-toggle{width:100%;background:none;border:none;border-top:1px solid #1a1a1a;padding:10px 0 4px;font-size:11px;color:#333;cursor:pointer;font-family:inherit;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.wt-history{padding:0 0 8px;}
.wt-session{margin-bottom:10px;}
.wt-session-date{font-size:10px;font-weight:700;color:#444;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.wt-session-pr{font-size:9px;color:#f0a500;background:#1a1400;padding:1px 6px;border-radius:10px;}
.wt-session-sets{display:flex;flex-direction:column;gap:3px;}
.wt-session-set{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0f0f0f;border-radius:7px;}
.wt-session-set-num{font-size:10px;color:#333;width:16px;}
.wt-session-weight{font-size:13px;font-weight:700;color:#ddd;}
.wt-session-reps{font-size:11px;color:#555;margin-left:auto;}
.wt-empty{font-size:12px;color:#2a2a2a;text-align:center;padding:8px 0;}
.wt-note-sep{border:none;border-top:1px solid #1a1a1a;margin:4px 0 10px;}

/* ── Workout Session ─────────────────────────────────── */
.session-banner{margin:0 14px 12px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.session-banner.idle{background:#111;border:1px dashed #222;}
.session-banner.active{background:#0a1f0a;border:1px solid #1D9E75;}
.session-info{flex:1;}
.session-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.session-sub{font-size:11px;color:#555;}
.session-btn{border:none;border-radius:9px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.session-btn.start{background:#1D9E75;color:#fff;}
.session-btn.end{background:#c84b4b;color:#fff;}
.session-timer{font-size:18px;font-weight:800;color:#1D9E75;letter-spacing:.04em;margin-bottom:2px;}
/* ── Last session hint ──────────────────────────────── */
.wt-last-hint{display:flex;align-items:center;gap:6px;background:#0f0f0f;border-radius:8px;padding:6px 10px;margin-bottom:8px;}
.wt-last-icon{font-size:12px;color:#555;}
.wt-last-txt{font-size:11px;color:#555;flex:1;}
.wt-last-txt span{color:#888;font-weight:600;}
/* ── Stats screen ───────────────────────────────────── */
.stats-screen{background:#0e0e0e;min-height:100vh;}
.stats-hdr{background:#111;border-bottom:1px solid #1a1a1a;padding:14px 16px 12px;position:sticky;top:0;z-index:20;}
.stats-title{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.stats-sub{font-size:12px;color:#444;margin-top:2px;}
.stats-body{padding:14px 13px 40px;}
.stats-section-title{font-size:10px;font-weight:700;color:#333;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 10px;}
.stats-section-title:first-child{margin-top:0;}
/* overview cards */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.ov-card{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:12px 14px;}
.ov-val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px;}
.ov-lbl{font-size:11px;color:#444;}
/* PR list */
.pr-list{display:flex;flex-direction:column;gap:6px;}
.pr-item{background:#141414;border:1px solid #1e1e1e;border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;}
.pr-item-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pr-item-val{font-size:13px;font-weight:800;color:#f0a500;flex-shrink:0;}
.pr-item-date{font-size:10px;color:#333;flex-shrink:0;}
/* Volume chart */
.vol-chart{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:14px;}
.vol-bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px;}
.vol-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.vol-bar{width:100%;background:#1D9E75;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s;}
.vol-bar-lbl{font-size:8px;color:#333;text-align:center;}
/* Session history */
.sess-list{display:flex;flex-direction:column;gap:8px;}
.sess-item{background:#141414;border:1px solid #1e1e1e;border-radius:11px;padding:11px 13px;}
.sess-item-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sess-item-day{font-size:13px;font-weight:700;}
.sess-item-date{font-size:11px;color:#444;}
.sess-item-stats{display:flex;gap:12px;}
.sess-stat{font-size:11px;color:#555;}
.sess-stat span{color:#888;font-weight:600;}
/* Nav tabs */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#111;border-top:1px solid #1a1a1a;display:flex;z-index:30;}
.nav-btn{flex:1;border:none;background:none;color:#333;padding:10px 0 14px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.active{color:#fff;}
.nav-icon{font-size:18px;line-height:1;}
/* push content above nav */
.has-nav{padding-bottom:64px;}
/* Progress bar on set */
.wt-set-row.set-done{opacity:.7;}
.wt-set-row.set-done .wt-inp,.wt-set-row.set-done .wt-rep-inp{border-color:#1D9E75;}

/* long-press edit */
.ex-name{-webkit-user-select:none;user-select:none;}
.ex-name.pressing{opacity:.5;}
.longpress-hint{font-size:9px;color:#2a2a2a;margin-top:2px;}
/* set add/remove */
.wt-set-ctrl{display:flex;gap:6px;margin-bottom:10px;}
.wt-ctrl-btn{flex:1;background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px;font-size:12px;font-weight:600;color:#555;cursor:pointer;font-family:inherit;}
.wt-ctrl-btn:active{background:#1a1a1a;}
.wt-del-set{background:none;border:none;color:#2a2a2a;font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;}
.wt-del-set:active{color:#c84b4b;}
/* photo controls */
.photo-empty{padding:20px;text-align:center;}
.photo-add-btn{background:#0f0f0f;border:1px dashed #252525;border-radius:10px;padding:14px 20px;font-size:12px;color:#3a3a3a;cursor:pointer;font-family:inherit;width:100%;}
.photo-add-btn:active{background:#161616;}
.photo-remove-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);border:1px solid #333;color:#c84b4b;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.media-toggle{display:flex;gap:6px;padding:8px 14px 10px;}
.media-tab{flex:1;background:#0f0f0f;border:1px solid #1e1e1e;border-radius:8px;padding:7px;font-size:11px;font-weight:600;color:#3a3a3a;cursor:pointer;font-family:inherit;}
.media-tab.active{background:#1a1a1a;border-color:#333;color:#aaa;}
/* prev weight badge on each set row */
.wt-prev-badge{font-size:10px;color:#3a3a3a;min-width:56px;text-align:right;flex-shrink:0;}
.wt-prev-badge.up{color:#1D9E75;}

/* detailed session history */
.sess-item.expanded{padding-bottom:4px;}
.sess-item-toggle{cursor:pointer;}
.sess-detail{margin-top:10px;padding-top:10px;border-top:1px solid #1a1a1a;display:flex;flex-direction:column;gap:8px;}
.sess-ex-block{background:#0f0f0f;border-radius:8px;padding:9px 11px;}
.sess-ex-name{font-size:12px;font-weight:700;color:#ccc;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.sess-ex-brand{font-size:9px;color:#333;font-weight:500;}
.sess-ex-sets{display:flex;flex-wrap:wrap;gap:5px;}
.sess-ex-set-pill{font-size:11px;font-weight:600;color:#888;background:#181818;padding:3px 8px;border-radius:6px;}
.export-section{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:14px;margin-bottom:20px;}
.export-btn{width:100%;background:#1a6cf6;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.export-btn:active{background:#1558d6;}
.export-hint{font-size:11px;color:#444;text-align:center;line-height:1.5;}
.export-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.export-modal{background:#141414;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;}
.export-modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.export-modal-title{font-size:15px;font-weight:700;}
.export-modal-close{background:#1e1e1e;border:none;color:#888;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.export-textarea{flex:1;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:12px;font-size:11px;color:#aaa;font-family:ui-monospace,monospace;line-height:1.6;resize:none;min-height:300px;margin-bottom:10px;}
.export-copy-btn{width:100%;background:#1D9E75;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.export-copy-btn.copied{background:#0a2a0a;}

.wt-inp::placeholder, .wt-rep-inp::placeholder{color:#3a3a3a;font-weight:600;opacity:1;}

.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;background:#141414;border:1px solid #1e1e1e;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;color:#444;cursor:pointer;font-family:inherit;white-space:nowrap;}
.cat-tab.active{background:#1a1a1a;border-color:#444;color:#fff;}
.cat-ex-list{display:flex;flex-direction:column;gap:8px;}
.cat-ex-card{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:12px 14px;cursor:pointer;}
.cat-ex-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.cat-ex-name{font-size:13px;font-weight:700;color:#eee;}
.cat-ex-pr{font-size:11px;font-weight:700;color:#f0a500;}
.cat-ex-count{font-size:10px;color:#333;}
.cat-ex-detail{margin-top:10px;padding-top:10px;border-top:1px solid #1a1a1a;display:flex;flex-direction:column;gap:8px;}
.cat-ex-sess{background:#0f0f0f;border-radius:8px;padding:8px 10px;}
.cat-ex-sess-date{font-size:10px;font-weight:700;color:#444;margin-bottom:4px;}
.cat-ex-sess-sets{display:flex;flex-wrap:wrap;gap:5px;}
.cat-ex-set-pill{font-size:11px;font-weight:600;color:#999;background:#181818;padding:3px 8px;border-radius:6px;}

/* general performance overview */
.perf-hero{background:linear-gradient(135deg,#141414,#1a1a1a);border:1px solid #222;border-radius:14px;padding:16px;margin-bottom:4px;}
.perf-streak{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.perf-streak-num{font-size:32px;font-weight:800;color:#f0a500;letter-spacing:-1px;line-height:1;}
.perf-streak-lbl{font-size:11px;color:#555;line-height:1.4;}
.perf-top-list{display:flex;flex-direction:column;gap:8px;}
.perf-top-item{display:flex;align-items:center;gap:10px;background:#0f0f0f;border-radius:9px;padding:9px 11px;}
.perf-top-rank{font-size:13px;font-weight:800;color:#333;width:18px;flex-shrink:0;}
.perf-top-rank.gold{color:#f0a500;}
.perf-top-rank.silver{color:#aaa;}
.perf-top-rank.bronze{color:#b06a3a;}
.perf-top-info{flex:1;min-width:0;}
.perf-top-name{font-size:12.5px;font-weight:600;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.perf-top-sub{font-size:10px;color:#444;}
.perf-top-val{font-size:13px;font-weight:800;color:#1D9E75;flex-shrink:0;}
.perf-muscle-grid{display:flex;flex-direction:column;gap:7px;}
.perf-muscle-row{display:flex;align-items:center;gap:10px;}
.perf-muscle-name{font-size:11px;color:#888;width:76px;flex-shrink:0;}
.perf-muscle-bar-wrap{flex:1;background:#0f0f0f;border-radius:6px;height:16px;overflow:hidden;}
.perf-muscle-bar{height:100%;border-radius:6px;transition:width .3s;}
.perf-muscle-val{font-size:10px;color:#333;width:32px;text-align:right;flex-shrink:0;}
.perf-gain-item{display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;border-radius:9px;padding:9px 11px;margin-bottom:6px;}
.perf-gain-name{font-size:12px;font-weight:600;color:#ccc;}
.perf-gain-vals{font-size:11px;color:#555;}
.perf-gain-pct{font-size:13px;font-weight:800;color:#1D9E75;}
.perf-gain-pct.neg{color:#666;}
.perf-empty-mini{font-size:11px;color:#2a2a2a;text-align:center;padding:10px 0;}

/* workout calendar heatmap */
.cal-wrap{background:#141414;border:1px solid #1e1e1e;border-radius:14px;padding:14px;margin-bottom:20px;}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-title{font-size:12px;font-weight:700;color:#888;}
.cal-legend{font-size:10px;color:#333;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.cal-weekday{font-size:9px;color:#333;text-align:center;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{aspect-ratio:1;border-radius:5px;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-size:9px;color:#2a2a2a;position:relative;}
.cal-day.trained{background:#1D9E75;color:#fff;font-weight:700;}
.cal-day.trained.light{background:#0e3a2c;}
.cal-day.today{box-shadow:0 0 0 1.5px #f0a500;}
.cal-day.empty{background:transparent;}
.cal-stats-row{display:flex;gap:8px;margin-top:12px;}
.cal-stat{flex:1;text-align:center;}
.cal-stat-val{font-size:18px;font-weight:800;color:#eee;}
.cal-stat-lbl{font-size:9px;color:#444;margin-top:1px;}
</style>

function getTodayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();}
function dateOnlyDiffDays(dateKeyA, dateKeyB){
  // both are 'YYYY-MM-DD' strings representing calendar dates (no time component)
  var pa=dateKeyA.split('-'), pb=dateKeyB.split('-');
  var da=Date.UTC(parseInt(pa[0]),parseInt(pa[1])-1,parseInt(pa[2]));
  var db=Date.UTC(parseInt(pb[0]),parseInt(pb[1])-1,parseInt(pb[2]));
  return Math.round((db-da)/(1000*60*60*24));
}
function formatDateKey(k){
  var p=k.split('-');var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var days2=['Paz','Pzt','Sal','Car','Per','Cum','Cmt'];
  var months=['Oca','Sub','Mar','Nis','May','Haz','Tem','Agu','Eyl','Eki','Kas','Ara'];
  var diff=dateOnlyDiffDays(k, getTodayKey());
  var rel=diff===0?'Bugun':diff===1?'Dun':diff+' gun once';
  return rel+' ('+days2[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+')';
}
function getPR(exId){var h=getHistory();var hx=h[exId];if(!hx)return null;var best=null;Object.values(hx).forEach(function(sess){sess.forEach(function(set){if(set.w&&set.r){var vol=parseFloat(set.w)*parseInt(set.r);if(!best||vol>best.vol){best={vol:vol,w:set.w,r:set.r};}}});});return best;}

  document.getElementById('navHome').className='nav-btn active';
  document.getElementById('navStats').className='nav-btn';
  var c=document.getElementById('dayList'); c.innerHTML='';

  if(!STORAGE_WORKS){
    var warnBanner=document.createElement('div');

    c.appendChild(warnBanner);
  }

  // Active session banner at top of home
  if(activeSession){
    var d2=days.find(function(x){return x.id===activeSession.dayId;});

  days.forEach(function(d){

    el.innerHTML='<div><span class="day-badge" style="background:'+d.color+'">'+d.label+'</span>'+activeTag
      +'<div class="day-name">'+d.tag+'</div><div class="day-info">'+d.sub+'</div>'
      +'<div class="day-info" style="margin-top:3px;color:'+(nc>0?'#5dbf5d':'#3a3a3a')+'">'
      +d.exercises.length+' egzersiz'+(nc>0?' &middot; '+nc+' not':'')+'</div></div>'
      +'<div class="day-arrow">&#8250;</div>';
    c.appendChild(el);
  });
}

function renderDay(){
  var d=days.find(function(x){return x.id===curDay;});

  // Session banner inside day view
  var isThisDay = activeSession && activeSession.dayId===curDay;

  var sInfo=document.createElement('div'); sInfo.className='session-info';
  if(isThisDay){
    var elapsed2=Math.floor((Date.now()-activeSession.startTime)/1000);

    var stimer=document.createElement('div'); stimer.className='session-timer'; stimer.id='session-timer';

  } else {
    var sicon=document.createElement('div'); sicon.className='session-title'; sicon.style.color='#333'; sicon.textContent='Antrenman baslatilmadi';
    var ssub2=document.createElement('div'); ssub2.className='session-sub'; ssub2.textContent='Baslat butonuna bas, sure ve setler kaydedilsin';
    sInfo.appendChild(sicon); sInfo.appendChild(ssub2);
    var sstartBtn=document.createElement('button'); sstartBtn.className='session-btn start'; sstartBtn.textContent='Baslat';
    sstartBtn.onclick=function(){startSession(curDay);};
    sessDiv.appendChild(sInfo); sessDiv.appendChild(sstartBtn);
  }
  c.appendChild(sessDiv);
  if(d.osgood){var ob=document.createElement('div');ob.className='osgood-box';ob.textContent=d.osgood;c.appendChild(ob);}

  d.exercises.forEach(function(ex,i){
    var myNote=notes[ex.id]||'';

    var hdr=document.createElement('div'); hdr.className='ex-hdr';

      if(e.target.classList.contains('edit-name-btn')||e.target.classList.contains('del-ex-btn'))return;
      if(edName===ex.id)return;
      if(openEx===ex.id){openEx=null;delete wtSets[ex.id];showHistory={};}else{openEx=ex.id;} edNote=null; renderDay();
    };
    var num=document.createElement('div'); num.className='ex-num'; num.style.background=d.color;
    num.innerHTML='<span>'+(i+1)+'</span>';
    var main=document.createElement('div'); main.className='ex-main';

    if(isEname){
      // Full edit mode: name + brand + sets all editable
      var ew=document.createElement('div'); ew.className='name-edit-wrap';
      var elbl1=document.createElement('div'); elbl1.style.cssText='font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;'; elbl1.textContent='Hareket Adi (uzun basarak actin)';
      var ei=document.createElement('input'); ei.className='name-edit-inp'; ei.type='text'; ei.value=ex.name; ei.placeholder='Hareket adi';
      ei.onclick=function(e){e.stopPropagation();};
      var erow=document.createElement('div'); erow.style.cssText='display:flex;gap:6px;margin-bottom:6px;';
      var elbl2=document.createElement('div'); elbl2.style.cssText='font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:4px;'; elbl2.textContent='Marka';
      var eiB=document.createElement('input'); eiB.className='name-edit-inp'; eiB.style.cssText='margin-bottom:0;flex:1;font-weight:400;font-size:12px;'; eiB.type='text'; eiB.value=ex.brand||''; eiB.placeholder='Marka (Panatta)';
      eiB.onclick=function(e){e.stopPropagation();};
      var elbl3=document.createElement('div'); elbl3.style.cssText='font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:4px;'; elbl3.textContent='Set x Rep';
      var eiS=document.createElement('input'); eiS.className='name-edit-inp'; eiS.style.cssText='margin-bottom:0;flex:1;font-weight:400;font-size:12px;'; eiS.type='text'; eiS.value=ex.sets||''; eiS.placeholder='3x12';

    hdr.appendChild(num); hdr.appendChild(main); hdr.appendChild(ch); card.appendChild(hdr);

    if(isOpen){

      // ── Weight Tracker ──────────────────────────────
      var history=getHistory();

      var todayKey=getTodayKey();
      var todaySets=exHistory[todayKey]||[];
      // init wtSets for this ex if not set
      if(!wtSets[ex.id]){
        // pre-fill from today's saved data or empty
        var numSets=parseInt((ex.sets||'3x').split('x')[0])||3;
        wtSets[ex.id]=[];
        for(var si2=0;si2<numSets;si2++){
          wtSets[ex.id].push({w:todaySets[si2]?todaySets[si2].w:'',r:todaySets[si2]?todaySets[si2].r:'',done:todaySets[si2]?true:false});
        }
      }
      var pr=getPR(ex.id);
      var wtsec=document.createElement('div'); wtsec.className='wt-section';
      // label + PR
      var wtlbl=document.createElement('div'); wtlbl.className='wt-lbl';
      var wtlblT=document.createElement('span'); wtlblT.textContent='Agirlik Takibi';
      wtlbl.appendChild(wtlblT);
      if(pr){var prBadge=document.createElement('span');prBadge.className='wt-pr';prBadge.textContent='PR: '+pr.w+'lb x'+pr.r;wtlbl.appendChild(prBadge);}
      wtsec.appendChild(wtlbl);
      // last session key (used only for ghost placeholder values below, no banner shown)
      var lastSessKeys=Object.keys(exHistory).sort(function(a,b){return b.localeCompare(a);});
      var lastKey=lastSessKeys.find(function(k){return k!==todayKey;});
      // set rows
      var wtsets=document.createElement('div'); wtsets.className='wt-sets';
      wtSets[ex.id].forEach(function(setObj,si3){
        var row=document.createElement('div'); row.className='wt-set-row';
        var snum=document.createElement('span'); snum.className='wt-set-num'; snum.textContent=(si3+1)+'.';
        var prevSetEarly = (lastKey && exHistory[lastKey] && exHistory[lastKey][si3]) ? exHistory[lastKey][si3] : null;
        var winp=document.createElement('input'); winp.className='wt-inp'; winp.type='number';
        winp.placeholder=(prevSetEarly&&prevSetEarly.w)?prevSetEarly.w:'lb';
        winp.value=setObj.w; winp.min='0'; winp.step='0.5';
        winp.oninput=(function(idx){return function(){wtSets[ex.id][idx].w=this.value;};})(si3);

        var wunit=document.createElement('span'); wunit.className='wt-unit'; wunit.textContent='lb';
        var wx=document.createElement('span'); wx.className='wt-x'; wx.textContent='×';
        var rinp=document.createElement('input'); rinp.className='wt-rep-inp'; rinp.type='number';
        rinp.placeholder=(prevSetEarly&&prevSetEarly.r)?prevSetEarly.r:'rep';
        rinp.value=setObj.r; rinp.min='0';
        rinp.oninput=(function(idx){return function(){wtSets[ex.id][idx].r=this.value;};})(si3);
        rinp.onclick=function(e){e.stopPropagation();};
        var runit=document.createElement('span'); runit.className='wt-rep-unit'; runit.textContent='rep';
        var doneBtn=document.createElement('button'); doneBtn.className='wt-done-btn'+(setObj.done?' done':'');
        row.className='wt-set-row'+(setObj.done?' set-done':'');
        doneBtn.textContent=setObj.done?'✓':'✓';
        doneBtn.onclick=(function(idx,wb,rb,db){return function(e){e.stopPropagation();

          var h2=getHistory(); if(!h2[ex.id])h2[ex.id]={};
          var tk=getTodayKey(); h2[ex.id][tk]=wtSets[ex.id].map(function(s){return{w:s.w,r:s.r};});
          saveHistory(h2); renderDay();
        };})(si3,winp,rinp,doneBtn);
        row.appendChild(snum); row.appendChild(winp); row.appendChild(wunit);
        row.appendChild(wx); row.appendChild(rinp); row.appendChild(runit);
        row.appendChild(doneBtn);
        // delete this set
        var dsb=document.createElement('button'); dsb.className='wt-del-set'; dsb.innerHTML='&times;';
        dsb.onclick=(function(idx){return function(e){e.stopPropagation();
          if(wtSets[ex.id].length<=1)return;
          wtSets[ex.id].splice(idx,1);
          var hd=getHistory(); if(!hd[ex.id])hd[ex.id]={};
          hd[ex.id][getTodayKey()]=wtSets[ex.id].map(function(s){return{w:s.w,r:s.r};});
          saveHistory(hd); renderDay();};})(si3);
        row.appendChild(dsb);
        wtsets.appendChild(row);

      wtsec.appendChild(wtsets);
      // add / remove set controls
      var sctrl=document.createElement('div'); sctrl.className='wt-set-ctrl';

      rmSetBtn.onclick=function(e){e.stopPropagation();

          hd2[ex.id][getTodayKey()]=wtSets[ex.id].map(function(s){return{w:s.w,r:s.r};});

      sctrl.appendChild(addSetBtn); sctrl.appendChild(rmSetBtn);

      // save all button

      saveAllBtn.style.background=d.color; saveAllBtn.textContent='Tum Setleri Kaydet';
      saveAllBtn.onclick=function(e){e.stopPropagation();
        var h3=getHistory(); if(!h3[ex.id])h3[ex.id]={};
        var tk2=getTodayKey(); h3[ex.id][tk2]=wtSets[ex.id].map(function(s){return{w:s.w,r:s.r};});
        saveHistory(h3);
        // flash button
        saveAllBtn.textContent='Kaydedildi!'; saveAllBtn.style.background='#1D9E75';
        setTimeout(function(){saveAllBtn.textContent='Tum Setleri Kaydet'; saveAllBtn.style.background=d.color;},1200);
      };
      wtsec.appendChild(saveAllBtn);
      // history toggle
      var histKeys=Object.keys(exHistory).sort(function(a,b){return b.localeCompare(a);}).filter(function(k){return k!==todayKey;});
      if(histKeys.length>0){
        var htog=document.createElement('button'); htog.className='wt-history-toggle';
        var histOpen=showHistory[ex.id]||false;
        htog.innerHTML=(histOpen?'&#9650;':'&#9660;')+' Gecmis ('+(histKeys.length)+' antrenman)';
        htog.onclick=function(e){e.stopPropagation(); showHistory[ex.id]=!showHistory[ex.id]; renderDay();};
        wtsec.appendChild(htog);
        if(histOpen){
          var hdiv=document.createElement('div'); hdiv.className='wt-history';
          histKeys.slice(0,8).forEach(function(hk){
            var sess=exHistory[hk]; if(!sess||!sess.length)return;
            var sd=document.createElement('div'); sd.className='wt-session';
            var sddate=document.createElement('div'); sddate.className='wt-session-date';
            var sdtxt=document.createElement('span'); sdtxt.textContent=formatDateKey(hk);
            sddate.appendChild(sdtxt);
            // session PR
            var sessMax=null;
            sess.forEach(function(s){if(s.w&&s.r){var v=parseFloat(s.w)*parseInt(s.r);if(!sessMax||v>sessMax.vol)sessMax={vol:v,w:s.w,r:s.r};}});
            if(sessMax){var sprbadge=document.createElement('span');sprbadge.className='wt-session-pr';sprbadge.textContent='En iyi: '+sessMax.w+'lb x'+sessMax.r;sddate.appendChild(sprbadge);}
            sd.appendChild(sddate);
            var ssetsDiv=document.createElement('div'); ssetsDiv.className='wt-session-sets';
            sess.forEach(function(s,si4){
              if(!s.w&&!s.r)return;
              var sr=document.createElement('div'); sr.className='wt-session-set';
              var sn=document.createElement('span'); sn.className='wt-session-set-num'; sn.textContent=(si4+1)+'.';
              var sw=document.createElement('span'); sw.className='wt-session-weight'; sw.textContent=(s.w||'-')+'lb';
              var sreps=document.createElement('span'); sreps.className='wt-session-reps'; sreps.textContent=(s.r||'-')+' rep';
              sr.appendChild(sn); sr.appendChild(sw); sr.appendChild(sreps); ssetsDiv.appendChild(sr);
            });
            sd.appendChild(ssetsDiv); hdiv.appendChild(sd);
          });
          wtsec.appendChild(hdiv);
        }
      }
      body.appendChild(wtsec);
      // separator + note
      var sep=document.createElement('hr'); sep.className='wt-note-sep'; body.appendChild(sep);
      var ns2=document.createElement('div'); ns2.className='note-sec';
      var nl=document.createElement('div'); nl.className='note-lbl'; nl.textContent='Notlar'; ns2.appendChild(nl);
      if(isEN){
        var ni=document.createElement('input'); ni.className='note-inp'; ni.type='text'; ni.value=myNote; ni.placeholder='Serbest not...';
        var nb=document.createElement('div'); nb.className='note-btns';
        var nsa=document.createElement('button'); nsa.className='save-btn'; nsa.style.background=d.color; nsa.textContent='Kaydet';
        nsa.onclick=function(){notes[ex.id]=ni.value.trim(); saveNotes(notes); edNote=null; renderDay();};
        var nca=document.createElement('button'); nca.className='cancel-btn'; nca.textContent='Iptal';
        nca.onclick=function(){edNote=null; renderDay();};
        nb.appendChild(nsa); nb.appendChild(nca); ns2.appendChild(ni); ns2.appendChild(nb);
        setTimeout(function(){ni.focus();},40);
      } else {
        var nd=document.createElement('div'); nd.className='note-disp'+(myNote?' has':'');
        nd.onclick=function(){edNote=ex.id; renderDay();};
        var nsp=document.createElement('span'); nsp.className=myNote?'note-val':'note-ph';
        nsp.textContent=myNote?'not: '+myNote:'+ Serbest not ekle...';
        nd.appendChild(nsp); ns2.appendChild(nd);
      }
      body.appendChild(ns2); card.appendChild(body);
    }
    c.appendChild(card);
  });

  // add exercise
  var aa=document.getElementById('addExArea'); aa.innerHTML='';
  if(addForm){
    var f=document.createElement('div'); f.className='add-ex-form';
    var ft=document.createElement('div'); ft.className='add-form-title'; ft.textContent='Yeni Hareket Ekle'; f.appendChild(ft);

    var r2=document.createElement('div'); r2.className='add-row';

  } else {
    var ab=document.createElement('button'); ab.className='add-ex-btn'; ab.textContent='+ Hareket Ekle';

    aa.appendChild(ab);
  }

// ── Session System ────────────────────────────────────────────────────────
var activeSession = load('active_session'); // {dayId, startTime, date}
var sessionTimerInterval = null;

function startSession(dayId){
  activeSession = {dayId:dayId, startTime:Date.now(), date:getTodayKey()};
  save('active_session', activeSession);
  startSessionTimer();
  renderDay();
}

function endSession(){
  if(!activeSession) return;
  var dur = Math.round((Date.now() - activeSession.startTime)/1000/60);
  var log = load('session_log')||[];
  var d = days.find(function(x){return x.id===activeSession.dayId;});
  // build detailed exercise breakdown for this session
  var exBreakdown=[];
  if(d){
    d.exercises.forEach(function(ex){
      var sets=wtSets[ex.id];
      if(sets){
        var doneSets=sets.filter(function(s){return s.w||s.r;});
        if(doneSets.length>0){
          exBreakdown.push({name:ex.name, brand:ex.brand||'', sets:doneSets.map(function(s){return{w:s.w,r:s.r};})});
        }
      }
    });
  }
  log.unshift({
    dayId:activeSession.dayId,
    dayTag:d?d.tag:'',
    daySub:d?d.sub:'',
    date:activeSession.date,
    duration:dur,
    sets:countDoneSets(),
    exercises:exBreakdown
  });
  if(log.length>100) log=log.slice(0,100);
  save('session_log', log);
  activeSession = null;
  save('active_session', null);
  clearInterval(sessionTimerInterval);
  wtSets = {};
  navTo('stats');
  setTimeout(function(){
    var el=document.getElementById('lastSessionCard');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },150);
}

function countDoneSets(){
  var total=0;
  Object.values(wtSets).forEach(function(sets){
    sets.forEach(function(s){if(s.done)total++;});
  });
  return total;
}

function startSessionTimer(){
  clearInterval(sessionTimerInterval);
  sessionTimerInterval = setInterval(function(){
    var el = document.getElementById('session-timer');
    if(el && activeSession){
      var elapsed = Math.floor((Date.now()-activeSession.startTime)/1000);
      var h=Math.floor(elapsed/3600), m=Math.floor((elapsed%3600)/60), s=elapsed%60;
      el.textContent = (h?h+'s ':'')+pad2(m)+':'+pad2(s);
    }
  }, 1000);
}

function pad2(n){return n<10?'0'+n:String(n);}

if(activeSession) startSessionTimer();

function buildDerivedLog(){
  // Build a log of "workout days" purely from weight history (gh),
  // so it works even if user never pressed Baslat/Bitir.
  var history = getHistory();
  var byDate = {}; // date -> {exercises:[{exId,name,brand,dayId,dayTag,sets}]}
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var exH = history[ex.id];
      if(!exH) return;
      Object.keys(exH).forEach(function(dateKey){
        var sets = exH[dateKey].filter(function(s){return s.w;});
        if(sets.length===0) return;
        if(!byDate[dateKey]) byDate[dateKey] = {};
        if(!byDate[dateKey][d.id]) byDate[dateKey][d.id] = {dayId:d.id, dayTag:d.tag, daySub:d.sub, exercises:[]};
        byDate[dateKey][d.id].exercises.push({name:ex.name, brand:ex.brand||'', sets:sets});
      });
    });
  });
  // Flatten into log entries: one entry per (date, day) combo
  var derivedLog=[];
  Object.keys(byDate).sort(function(a,b2){return b2.localeCompare(a);}).forEach(function(dateKey){
    Object.values(byDate[dateKey]).forEach(function(dayEntry){
      var totalSets=0;
      dayEntry.exercises.forEach(function(e){totalSets+=e.sets.length;});
      derivedLog.push({
        dayId:dayEntry.dayId, dayTag:dayEntry.dayTag, daySub:dayEntry.daySub,
        date:dateKey, duration:null, sets:totalSets, exercises:dayEntry.exercises
      });
    });
  });
  return derivedLog;
}

    if(l.exercises && l.exercises.length>0){
      l.exercises.forEach(function(exb){
        var setStr = exb.sets.map(function(s,i){return (i+1)+'.'+(s.w||'-')+'lb'+(s.r?'x'+s.r:'');}).join(', ');
        lines.push('  - '+exb.name+' ('+(exb.brand||'')+'): '+setStr);
      });
    } else {
      lines.push('  (detay kaydi yok)');
    }
    lines.push('');
  });
  // PR summary
  var history=getHistory();
  var prLines=[];
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var pr=getPR(ex.id);
      if(pr) prLines.push(ex.name+': '+pr.w+'lb x'+pr.r+' (en iyi set)');
    });
  });
  if(prLines.length>0){
    lines.push('='.repeat(40));
    lines.push('KISISEL REKORLAR (PR)');
    lines.push('='.repeat(40));
    prLines.forEach(function(p){lines.push(p);});
  }
  return lines.join('\n');
}

function computeStreak(){
  var log = buildDerivedLog();
  if(log.length===0) return 0;
  var dates = Array.from(new Set(log.map(function(l){return l.date;}))).sort(function(a,b2){return b2.localeCompare(a);});
  var todayKey = getTodayKey();
  var streak=0;
  var cursor = todayKey;
  // allow streak to start from today or yesterday (so a rest day today doesn't zero it out)
  var startIdx = dates.indexOf(todayKey);
  if(startIdx===-1){
    var diffFromToday = dateOnlyDiffDays(dates[0], todayKey);
    if(diffFromToday>1) return 0; // more than 1 day gap from today, streak broken
  }
  var prevDate=null;
  dates.forEach(function(dk){
    if(prevDate===null){ streak=1; prevDate=dk; return; }
    var gap = dateOnlyDiffDays(dk, prevDate);
    if(gap===-1){ streak++; prevDate=dk; }
    else { prevDate=null; } // streak broken, stop counting further back conceptually
  });
  // simpler robust approach: count consecutive-day chain from most recent date backward
  streak=1;
  for(var i=0;i<dates.length-1;i++){
    var gap2 = dateOnlyDiffDays(dates[i+1], dates[i]);
    if(gap2===-1) streak++; else break;
  }
  return streak;
}

function computeTopExercises(){
  // "top" by total volume ever lifted (sum of w*r across all sets, all time)
  var history = getHistory();
  var results=[];
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var exH = history[ex.id];
      if(!exH) return;
      var totalVolume=0, sessionCount=0;
      Object.values(exH).forEach(function(sess){
        var hasData=false;
        sess.forEach(function(s){
          if(s.w && s.r){ totalVolume += parseFloat(s.w)*parseInt(s.r); hasData=true; }
        });
        if(hasData) sessionCount++;
      });
      if(totalVolume>0){
        results.push({name:ex.name, brand:ex.brand||'', volume:totalVolume, sessions:sessionCount, dayTag:d.tag});
      }
    });
  });
  results.sort(function(a,b2){return b2.volume-a.volume;});
  return results.slice(0,5);
}

function computeMuscleFocus(){
  // approximate muscle group by day category, weighted by total sets logged
  var history = getHistory();
  var groups = {'Gogus':0,'Sirt':0,'Omuz':0,'Kol':0,'Bacak':0};
  var dayToGroup = {
    'd1':{'Gogus':4,'Kol':2}, 'd2':{'Sirt':4,'Kol':2}, 'd3':{'Kol':6},
    'd4':{'Gogus':3,'Omuz':2,'Kol':1}, 'd5':{'Sirt':4,'Omuz':2,'Kol':1},
    'd6':{'Omuz':3,'Bacak':4}
  };
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var exH = history[ex.id];
      if(!exH) return;
      var setCount=0;
      Object.values(exH).forEach(function(sess){
        setCount += sess.filter(function(s){return s.w;}).length;
      });
      var weights = dayToGroup[d.id]||{};
      var totalW = Object.values(weights).reduce(function(a,v){return a+v;},0) || 1;
      Object.keys(weights).forEach(function(g){
        groups[g] += setCount * (weights[g]/totalW);
      });
    });
  });
  var total = Object.values(groups).reduce(function(a,v){return a+v;},0) || 1;
  var result = Object.keys(groups).map(function(g){
    return {name:g, pct: Math.round((groups[g]/total)*100), count: Math.round(groups[g])};
  }).sort(function(a,b2){return b2.pct-a.pct;});
  return result;
}

function computeBiggestGains(){
  // compare first-ever logged weight vs most recent (PR-level) weight per exercise
  var history = getHistory();
  var gains=[];
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var exH = history[ex.id];
      if(!exH) return;
      var dateKeys = Object.keys(exH).sort();
      if(dateKeys.length<2) return; // need at least 2 sessions to show growth
      function maxWeightInSession(sess){
        var mx=0; sess.forEach(function(s){if(s.w) mx=Math.max(mx,parseFloat(s.w));}); return mx;
      }
      var firstW = maxWeightInSession(exH[dateKeys[0]]);
      var lastW = maxWeightInSession(exH[dateKeys[dateKeys.length-1]]);
      if(firstW>0 && lastW>0){
        var pct = Math.round(((lastW-firstW)/firstW)*100);
        gains.push({name:ex.name, first:firstW, last:lastW, pct:pct});
      }
    });
  });
  gains.sort(function(a,b2){return b2.pct-a.pct;});
  return gains.slice(0,4);
}

function computeCalendarData(weeksBack){
  // Build a 7xN grid for the last `weeksBack` weeks, ending today.
  // Returns array of weeks, each week is array of 7 {dateKey, trained, isToday, dayNum, inRange}
  var log = buildDerivedLog();
  var trainedDates = {};
  log.forEach(function(l){ trainedDates[l.date]=true; });

  var today = new Date();
  var todayKey = getTodayKey();
  // find the Monday of the current week
  var dow = today.getDay(); // 0=Sun..6=Sat
  var mondayOffset = (dow===0)?-6:(1-dow);
  var startOfThisWeek = new Date(today);
  startOfThisWeek.setDate(today.getDate()+mondayOffset);

  var weeks=[];
  for(var w=weeksBack-1; w>=0; w--){
    var week=[];
    for(var d=0; d<7; d++){
      var dt = new Date(startOfThisWeek);
      dt.setDate(startOfThisWeek.getDate() - (w*7) + d);
      var dk = dt.getFullYear()+'-'+(dt.getMonth()+1<10?'0':'')+(dt.getMonth()+1)+'-'+(dt.getDate()<10?'0':'')+dt.getDate();
      week.push({
        dateKey:dk,
        trained: !!trainedDates[dk],
        isToday: dk===todayKey,
        dayNum: dt.getDate(),
        isFuture: dt > today
      });
    }
    weeks.push(week);
  }
  return weeks;
}

function computeMonthStats(){
  var log = buildDerivedLog();
  var now = new Date();
  var thisMonthCount = log.filter(function(l){
    var p=l.date.split('-');
    return parseInt(p[0])===now.getFullYear() && parseInt(p[1])===now.getMonth()+1;
  }).length;
  var uniqueDates = Array.from(new Set(log.map(function(l){return l.date;})));
  var totalDays = uniqueDates.length;
  var longestStreak = computeLongestStreak(uniqueDates);
  return {thisMonth:thisMonthCount, total:totalDays, longestStreak:longestStreak};
}

function computeLongestStreak(uniqueDates){
  if(uniqueDates.length===0) return 0;
  var sorted = uniqueDates.slice().sort();
  var longest=1, cur=1;
  for(var i=1;i<sorted.length;i++){
    var gap = dateOnlyDiffDays(sorted[i-1], sorted[i]);
    if(gap===1){ cur++; longest=Math.max(longest,cur); }
    else { cur=1; }
  }
  return longest;
}
