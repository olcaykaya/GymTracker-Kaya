<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Olcay Gym Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0e0e0e;font-family:-apple-system,system-ui,sans-serif;color:#fff;min-height:100vh;max-width:480px;margin:0 auto;}
.screen{display:none;}.screen.active{display:block;}
.home-hdr{padding:36px 20px 18px;border-bottom:1px solid #1a1a1a;}
.home-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;color:#444;text-transform:uppercase;margin-bottom:5px;}
.home-title{font-size:28px;font-weight:800;letter-spacing:-.6px;}
.home-brands{font-size:12px;color:#333;margin-top:4px;}
.day-list{padding:16px 14px 40px;}
.day-card{background:#141414;border:1px solid #1e1e1e;border-left-width:3px;border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.day-card:active{background:#1c1c1c;}
.day-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;letter-spacing:.06em;display:inline-block;margin-bottom:5px;}
.day-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.day-info{font-size:11px;color:#444;}
.day-arrow{font-size:22px;color:#252525;flex-shrink:0;}
.day-hdr{background:#111;border-bottom:1px solid #1a1a1a;padding:14px 16px 12px;position:sticky;top:0;z-index:20;}
.back-btn{background:#1e1e1e;border:none;color:#888;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:9px;display:inline-block;}
.day-hdr-title{font-size:21px;font-weight:800;letter-spacing:-.3px;}
.day-hdr-sub{font-size:12px;color:#444;margin-top:2px;}
.ex-list{padding:12px 12px 8px;}
.osgood-box{background:#1a1000;border-left:3px solid #c8860a;border-radius:10px;padding:10px 13px;font-size:12px;color:#c8860a;line-height:1.65;margin-bottom:12px;}
.ex-card{background:#141414;border:1px solid #1e1e1e;border-radius:14px;margin-bottom:10px;overflow:hidden;}
.ex-hdr{padding:13px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;}
.ex-num{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.ex-num span{font-size:11px;font-weight:800;color:#fff;}
.ex-main{flex:1;min-width:0;}
.ex-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.ex-name{font-size:14px;font-weight:700;line-height:1.35;flex:1;min-width:0;word-break:break-word;}
.edit-name-btn{background:none;border:none;color:#2a2a2a;font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1;}
.del-ex-btn{background:none;border:none;color:#2a2a2a;font-size:14px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1;}
.ex-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ex-sets{font-size:13px;font-weight:800;}
.ex-rir{font-size:11px;color:#444;}
.ex-brand-pill{font-size:10px;font-weight:600;background:#1a1a1a;padding:2px 7px;border-radius:5px;}
.ex-note-prev{margin-top:6px;font-size:12px;color:#5dbf5d;background:#0b240b;border-radius:6px;padding:4px 8px;}
.ex-chev{color:#252525;font-size:22px;flex-shrink:0;line-height:1;transition:transform .2s;}
.ex-chev.open{transform:rotate(90deg);}
.ex-body{border-top:1px solid #1a1a1a;display:none;}
.ex-body.open{display:block;}
.machine-wrap{background:#0c0c0c;padding:0;position:relative;border-bottom:1px solid #1a1a1a;overflow:hidden;}
.machine-wrap .svgbox{padding:14px 0 6px;display:flex;justify-content:center;}
.machine-wrap .svgbox svg{max-width:280px;width:100%;}
.machine-wrap img.custom-img{width:100%;height:200px;object-fit:cover;display:block;}
.img-change-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);border:1px solid #333;color:#bbb;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.machine-label{text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;color:#2a2a2a;text-transform:uppercase;padding:4px 0 10px;}
.ex-tip{margin:12px 14px 0;font-size:12.5px;color:#999;line-height:1.7;background:#0f0f0f;border-radius:9px;padding:11px 13px;border-left:3px solid #2a2a2a;}
.note-sec{padding:12px 14px 15px;}
.note-lbl{font-size:10px;font-weight:700;color:#3a3a3a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.note-disp{background:#0f0f0f;border:1px dashed #222;border-radius:9px;padding:11px 13px;cursor:pointer;min-height:44px;display:flex;align-items:center;}
.note-disp.has{background:#0b220b;border-color:#1e4a1e;}
.note-ph{font-size:13px;color:#2a2a2a;}
.note-val{font-size:13px;color:#5dbf5d;}
.note-inp{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:9px;padding:11px 13px;font-size:13px;color:#fff;outline:none;font-family:inherit;margin-bottom:9px;}
.note-btns{display:flex;gap:8px;}
.save-btn{flex:1;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:9px;padding:11px;font-size:13px;color:#666;cursor:pointer;}
.name-edit-wrap{margin-bottom:4px;}
.name-edit-inp{width:100%;background:#0f0f0f;border:1px solid #444;border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;margin-bottom:6px;}
.name-edit-btns{display:flex;gap:6px;}
.name-save-btn{flex:1;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.name-cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:8px;padding:8px;font-size:12px;color:#666;cursor:pointer;font-family:inherit;}
.add-ex-area{margin:0 12px 40px;}
.add-ex-btn{width:100%;background:#141414;border:1px dashed #252525;border-radius:12px;padding:13px;font-size:13px;color:#2a2a2a;cursor:pointer;font-family:inherit;text-align:center;}
.add-ex-btn:active{background:#1c1c1c;}
.add-ex-form{background:#141414;border:1px solid #222;border-radius:12px;padding:14px;}
.add-form-title{font-size:11px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.add-inp{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:8px;padding:10px 12px;font-size:13px;color:#fff;outline:none;font-family:inherit;margin-bottom:8px;}
.add-inp::placeholder{color:#2a2a2a;}
.add-row{display:flex;gap:8px;margin-bottom:0;}
.add-row .add-inp{margin-bottom:8px;flex:1;}
.add-form-btns{display:flex;gap:8px;margin-top:4px;}
.add-confirm-btn{flex:1;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.add-cancel-btn{flex:1;background:#1a1a1a;border:none;border-radius:9px;padding:10px;font-size:13px;color:#666;cursor:pointer;font-family:inherit;}
#imgFileInput{display:none;}

/* ── Weight Tracker ─────────────────────────────────── */
.wt-section{padding:12px 14px 4px;}
.wt-lbl{font-size:10px;font-weight:700;color:#3a3a3a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.wt-pr{font-size:10px;font-weight:700;color:#f0a500;background:#1a1400;padding:2px 8px;border-radius:20px;}
.wt-sets{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.wt-set-row{display:flex;align-items:center;gap:6px;}
.wt-set-num{font-size:11px;font-weight:700;color:#333;width:18px;flex-shrink:0;text-align:center;}
.wt-inp{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;text-align:center;width:72px;flex-shrink:0;}
.wt-inp:focus{border-color:#444;}
.wt-unit{font-size:11px;color:#333;flex-shrink:0;}
.wt-x{font-size:13px;color:#2a2a2a;flex-shrink:0;}
.wt-rep-inp{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:inherit;text-align:center;width:52px;flex-shrink:0;}
.wt-rep-inp:focus{border-color:#444;}
.wt-rep-unit{font-size:11px;color:#333;flex-shrink:0;}
.wt-done-btn{margin-left:auto;background:#0a1f0a;border:1.5px solid #1a3a1a;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:#3a8a3a;cursor:pointer;flex-shrink:0;font-family:inherit;}
.wt-done-btn.done{background:#0b2a0b;border-color:#1D9E75;color:#1D9E75;}
.wt-save-btn{width:100%;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.wt-history-toggle{width:100%;background:none;border:none;border-top:1px solid #1a1a1a;padding:10px 0 4px;font-size:11px;color:#333;cursor:pointer;font-family:inherit;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.wt-history{padding:0 0 8px;}
.wt-session{margin-bottom:10px;}
.wt-session-date{font-size:10px;font-weight:700;color:#444;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.wt-session-pr{font-size:9px;color:#f0a500;background:#1a1400;padding:1px 6px;border-radius:10px;}
.wt-session-sets{display:flex;flex-direction:column;gap:3px;}
.wt-session-set{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0f0f0f;border-radius:7px;}
.wt-session-set-num{font-size:10px;color:#333;width:16px;}
.wt-session-weight{font-size:13px;font-weight:700;color:#ddd;}
.wt-session-reps{font-size:11px;color:#555;margin-left:auto;}
.wt-empty{font-size:12px;color:#2a2a2a;text-align:center;padding:8px 0;}
.wt-note-sep{border:none;border-top:1px solid #1a1a1a;margin:4px 0 10px;}

/* ── Workout Session ─────────────────────────────────── */
.session-banner{margin:0 14px 12px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.session-banner.idle{background:#111;border:1px dashed #222;}
.session-banner.active{background:#0a1f0a;border:1px solid #1D9E75;}
.session-info{flex:1;}
.session-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.session-sub{font-size:11px;color:#555;}
.session-btn{border:none;border-radius:9px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.session-btn.start{background:#1D9E75;color:#fff;}
.session-btn.end{background:#c84b4b;color:#fff;}
.session-timer{font-size:18px;font-weight:800;color:#1D9E75;letter-spacing:.04em;margin-bottom:2px;}
/* ── Last session hint ──────────────────────────────── */
.wt-last-hint{display:flex;align-items:center;gap:6px;background:#0f0f0f;border-radius:8px;padding:6px 10px;margin-bottom:8px;}
.wt-last-icon{font-size:12px;color:#555;}
.wt-last-txt{font-size:11px;color:#555;flex:1;}
.wt-last-txt span{color:#888;font-weight:600;}
/* ── Stats screen ───────────────────────────────────── */
.stats-screen{background:#0e0e0e;min-height:100vh;}
.stats-hdr{background:#111;border-bottom:1px solid #1a1a1a;padding:14px 16px 12px;position:sticky;top:0;z-index:20;}
.stats-title{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.stats-sub{font-size:12px;color:#444;margin-top:2px;}
.stats-body{padding:14px 13px 40px;}
.stats-section-title{font-size:10px;font-weight:700;color:#333;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 10px;}
.stats-section-title:first-child{margin-top:0;}
/* overview cards */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.ov-card{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:12px 14px;}
.ov-val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px;}
.ov-lbl{font-size:11px;color:#444;}
/* PR list */
.pr-list{display:flex;flex-direction:column;gap:6px;}
.pr-item{background:#141414;border:1px solid #1e1e1e;border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;}
.pr-item-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pr-item-val{font-size:13px;font-weight:800;color:#f0a500;flex-shrink:0;}
.pr-item-date{font-size:10px;color:#333;flex-shrink:0;}
/* Volume chart */
.vol-chart{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:14px;}
.vol-bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px;}
.vol-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.vol-bar{width:100%;background:#1D9E75;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s;}
.vol-bar-lbl{font-size:8px;color:#333;text-align:center;}
/* Session history */
.sess-list{display:flex;flex-direction:column;gap:8px;}
.sess-item{background:#141414;border:1px solid #1e1e1e;border-radius:11px;padding:11px 13px;}
.sess-item-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sess-item-day{font-size:13px;font-weight:700;}
.sess-item-date{font-size:11px;color:#444;}
.sess-item-stats{display:flex;gap:12px;}
.sess-stat{font-size:11px;color:#555;}
.sess-stat span{color:#888;font-weight:600;}
/* Nav tabs */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#111;border-top:1px solid #1a1a1a;display:flex;z-index:30;}
.nav-btn{flex:1;border:none;background:none;color:#333;padding:10px 0 14px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.active{color:#fff;}
.nav-icon{font-size:18px;line-height:1;}
/* push content above nav */
.has-nav{padding-bottom:64px;}
/* Progress bar on set */
.wt-set-row.set-done{opacity:.7;}
.wt-set-row.set-done .wt-inp,.wt-set-row.set-done .wt-rep-inp{border-color:#1D9E75;}

/* long-press edit */
.ex-name{-webkit-user-select:none;user-select:none;}
.ex-name.pressing{opacity:.5;}
.longpress-hint{font-size:9px;color:#2a2a2a;margin-top:2px;}
/* set add/remove */
.wt-set-ctrl{display:flex;gap:6px;margin-bottom:10px;}
.wt-ctrl-btn{flex:1;background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px;font-size:12px;font-weight:600;color:#555;cursor:pointer;font-family:inherit;}
.wt-ctrl-btn:active{background:#1a1a1a;}
.wt-del-set{background:none;border:none;color:#2a2a2a;font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;}
.wt-del-set:active{color:#c84b4b;}
/* photo controls */
.photo-empty{padding:20px;text-align:center;}
.photo-add-btn{background:#0f0f0f;border:1px dashed #252525;border-radius:10px;padding:14px 20px;font-size:12px;color:#3a3a3a;cursor:pointer;font-family:inherit;width:100%;}
.photo-add-btn:active{background:#161616;}
.photo-remove-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);border:1px solid #333;color:#c84b4b;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.media-toggle{display:flex;gap:6px;padding:8px 14px 10px;}
.media-tab{flex:1;background:#0f0f0f;border:1px solid #1e1e1e;border-radius:8px;padding:7px;font-size:11px;font-weight:600;color:#3a3a3a;cursor:pointer;font-family:inherit;}
.media-tab.active{background:#1a1a1a;border-color:#333;color:#aaa;}
/* prev weight badge on each set row */
.wt-prev-badge{font-size:10px;color:#3a3a3a;min-width:56px;text-align:right;flex-shrink:0;}
.wt-prev-badge.up{color:#1D9E75;}
</style>
</head>
<body>
<div class="screen active" id="homeScreen">
  <div class="home-hdr">
    <div class="home-eyebrow">Olcay Training</div>
    <div class="home-title">Gym Tracker</div>
    <div class="home-brands">Panatta &middot; Arsenal Strength &middot; FreeMotion</div>
  </div>
  <div class="day-list has-nav" id="dayList"></div>
</div>
<div class="screen" id="dayScreen">
  <div class="day-hdr">
    <div class="back-btn" id="backBtn">&#8592; Geri</div>
    <div class="day-hdr-title" id="dayTitle"></div>
    <div class="day-hdr-sub" id="daySub"></div>
  </div>
  <div class="ex-list has-nav" id="exList"></div>
  <div class="add-ex-area has-nav" id="addExArea"></div>
</div>
<input type="file" id="imgFileInput" accept="image/*">
<script>

var _m={};
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return _m[k]||null;}}
function save(k,v){_m[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getDays(){return load('gd')||JSON.parse(JSON.stringify(DEFAULT_DAYS));}
function saveDays(d){save('gd',d);}
function getNotes(){return load('gn')||{};}
function saveNotes(n){save('gn',n);}
function getImages(){return load('gi')||{};}
function saveImages(m){save('gi',m);}

var days=getDays(), notes=getNotes(), images=getImages();

function getHistory(){return load('gh')||{};}
function saveHistory(h){save('gh',h);}
function getTodayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();}
function formatDateKey(k){var p=k.split('-');var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));var days2=['Paz','Pzt','Sal','Car','Per','Cum','Cmt'];var months=['Oca','Sub','Mar','Nis','May','Haz','Tem','Agu','Eyl','Eki','Kas','Ara'];var diff=Math.round((new Date()-d)/(1000*60*60*24));var rel=diff===0?'Bugun':diff===1?'Dun':diff+' gun once';return rel+' ('+days2[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+')';}
function getPR(exId){var h=getHistory();var hx=h[exId];if(!hx)return null;var best=null;Object.values(hx).forEach(function(sess){sess.forEach(function(set){if(set.w&&set.r){var vol=parseFloat(set.w)*parseInt(set.r);if(!best||vol>best.vol){best={vol:vol,w:set.w,r:set.r};}}});});return best;}

function goHome(){
  document.getElementById('homeScreen').className='screen active';
  document.getElementById('dayScreen').className='screen';
  curDay=null;openEx=null;edNote=null;edName=null;addForm=false;
  buildHome();
}
document.getElementById('backBtn').onclick=goHome;

function openDay(id){
  curDay=id; openEx=null; edNote=null; edName=null; addForm=false;
  var d=days.find(function(x){return x.id===id;});
  document.getElementById('homeScreen').className='screen';
  document.getElementById('dayScreen').className='screen active';
  document.getElementById('statsScreen').className='screen';
  document.getElementById('dayTitle').textContent=d.tag;
  document.getElementById('daySub').textContent=d.sub;
  renderDay(); window.scrollTo(0,0);
}

function buildHome(){
  var c=document.getElementById('dayList'); c.innerHTML='';
  days.forEach(function(d){
    var nc=d.exercises.filter(function(e){return notes[e.id];}).length;
    var el=document.createElement('div');
    el.className='day-card'; el.style.borderLeftColor=d.color;
    el.onclick=function(){openDay(d.id);};
    el.innerHTML='<div><span class="day-badge" style="background:'+d.color+'">'+d.label+'</span>'
      +'<div class="day-name">'+d.tag+'</div><div class="day-info">'+d.sub+'</div>'
      +'<div class="day-info" style="margin-top:3px;color:'+(nc>0?'#5dbf5d':'#3a3a3a')+'">'
      +d.exercises.length+' egzersiz'+(nc>0?' &middot; '+nc+' not':'')+'</div></div>'
      +'<div class="day-arrow">&#8250;</div>';
    c.appendChild(el);
  });
}

function renderDay(){
  var d=days.find(function(x){return x.id===curDay;});
  var c=document.getElementById('exList'); c.innerHTML='';
  // Session banner inside day view

  var sInfo=document.createElement('div'); sInfo.className='session-info';

    var elapsed2=Math.floor((Date.now()-activeSession.startTime)/1000);
    var sh=Math.floor(elapsed2/3600),sm=Math.floor((elapsed2%3600)/60),ss2=elapsed2%60;
    var stimer=document.createElement('div'); stimer.className='session-timer'; stimer.id='session-timer';

    var ssub=document.createElement('div'); ssub.className='session-sub'; ssub.textContent=formatDateKey(activeSession.date);
    sInfo.appendChild(stimer); sInfo.appendChild(stitle); sInfo.appendChild(ssub);
    var sendBtn=document.createElement('button'); sendBtn.className='session-btn end'; sendBtn.textContent='Bitir';
    sendBtn.onclick=endSession;
    sessDiv.appendChild(sInfo); sessDiv.appendChild(sendBtn);
    startSessionTimer();

    var sicon=document.createElement('div'); sicon.className='session-title'; sicon.style.color='#333'; sicon.textContent='Antrenman baslatilmadi';

  }
  c.appendChild(sessDiv);

  d.exercises.forEach(function(ex,i){

document.getElementById('imgFileInput').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file||!imgTarget)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    // Compress if image is large
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=800, maxH=600;
      var w=img.width, h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      images[imgTarget]=canvas.toDataURL('image/jpeg',0.8);
      saveImages(images); imgTarget=null; e.target.value=''; renderDay();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ── Session System ────────────────────────────────────────────────────────
var activeSession = load('active_session'); // {dayId, startTime, date}
var sessionTimerInterval = null;

function startSession(dayId){
  activeSession = {dayId:dayId, startTime:Date.now(), date:getTodayKey()};
  save('active_session', activeSession);
  startSessionTimer();
  renderDay();
}

function endSession(){
  if(!activeSession) return;
  var dur = Math.round((Date.now() - activeSession.startTime)/1000/60);
  var log = load('session_log')||[];
  var d = days.find(function(x){return x.id===activeSession.dayId;});
  log.unshift({dayId:activeSession.dayId, dayTag:d?d.tag:'', date:activeSession.date, duration:dur, sets:countDoneSets()});
  if(log.length>60) log=log.slice(0,60);
  save('session_log', log);
  activeSession = null;
  save('active_session', null);
  clearInterval(sessionTimerInterval);
  // clear wtSets so next open is fresh
  wtSets = {};
  alert('Antrenman tamamlandi! Sure: '+dur+' dakika. Tebrikler!');
  renderDay();
}

function countDoneSets(){
  var total=0;
  Object.values(wtSets).forEach(function(sets){
    sets.forEach(function(s){if(s.done)total++;});
  });
  return total;
}

function startSessionTimer(){
  clearInterval(sessionTimerInterval);
  sessionTimerInterval = setInterval(function(){
    var el = document.getElementById('session-timer');
    if(el && activeSession){
      var elapsed = Math.floor((Date.now()-activeSession.startTime)/1000);
      var h=Math.floor(elapsed/3600), m=Math.floor((elapsed%3600)/60), s=elapsed%60;
      el.textContent = (h?h+'s ':'')+pad2(m)+':'+pad2(s);
    }
  }, 1000);
}

function pad2(n){return n<10?'0'+n:String(n);}

if(activeSession) startSessionTimer();

function renderStats(){
  var body = document.getElementById('statsBody');
  body.innerHTML='';
  var log = load('session_log')||[];
  var history = getHistory();

  // subtitle
  document.getElementById('statsSubtitle').textContent = log.length+' antrenman kaydi';

  // ── Overview cards
  var t1 = document.createElement('div'); t1.className='stats-section-title'; t1.textContent='Genel Bakis'; body.appendChild(t1);
  var grid = document.createElement('div'); grid.className='overview-grid';

  var totalSess = log.length;
  var totalMins = log.reduce(function(a,l){return a+(l.duration||0);},0);
  var thisWeek = log.filter(function(l){
    var d=new Date(l.date); var now=new Date(); var diff=(now-d)/(1000*60*60*24);
    return diff<7;
  }).length;

  // count total sets ever
  var totalSetsEver=0;
  Object.values(history).forEach(function(exH){
    Object.values(exH).forEach(function(sess){totalSetsEver+=sess.filter(function(s){return s.w;}).length;});
  });

  var cards=[
    {val:totalSess, lbl:'Toplam Antrenman', color:'#1a6cf6'},
    {val:thisWeek, lbl:'Bu Hafta', color:'#1D9E75'},
    {val:totalMins+'dk', lbl:'Toplam Sure', color:'#9b3fc8'},
    {val:totalSetsEver, lbl:'Toplam Set', color:'#e05a30'},
  ];
  cards.forEach(function(c){
    var card=document.createElement('div'); card.className='ov-card';
    var val=document.createElement('div'); val.className='ov-val'; val.style.color=c.color; val.textContent=c.val;
    var lbl=document.createElement('div'); lbl.className='ov-lbl'; lbl.textContent=c.lbl;
    card.appendChild(val); card.appendChild(lbl); grid.appendChild(card);
  });
  body.appendChild(grid);

  // ── Volume (last 8 sessions bar chart)
  if(log.length>0){
    var t2=document.createElement('div'); t2.className='stats-section-title'; t2.textContent='Son 8 Antrenman Suresι'; body.appendChild(t2);
    var vc=document.createElement('div'); vc.className='vol-chart';
    var bars=document.createElement('div'); bars.className='vol-bars';
    var recent=log.slice(0,8).reverse();
    var maxDur=Math.max.apply(null,recent.map(function(l){return l.duration||1;}));
    recent.forEach(function(l){
      var bw=document.createElement('div'); bw.className='vol-bar-wrap';
      var b=document.createElement('div'); b.className='vol-bar';
      b.style.height=Math.max(4,Math.round(((l.duration||0)/maxDur)*76))+'px';
      b.title=l.duration+'dk';
      var bl=document.createElement('div'); bl.className='vol-bar-lbl';
      var dp=l.date.split('-'); bl.textContent=(dp[2]||'?')+'/'+(dp[1]||'?');
      bw.appendChild(b); bw.appendChild(bl); bars.appendChild(bw);
    });
    vc.appendChild(bars);
    var vcNote=document.createElement('div'); vcNote.style.cssText='font-size:10px;color:#333;text-align:center;'; vcNote.textContent='Antrenman suresi (dakika)';
    vc.appendChild(vcNote); body.appendChild(vc);
  }

  // ── PR Board
  var prs=[];
  days.forEach(function(d){
    d.exercises.forEach(function(ex){
      var pr=getPR(ex.id);
      if(pr) prs.push({name:ex.name, brand:ex.brand, pr:pr, dayTag:d.tag});
    });
  });
  if(prs.length>0){
    var t3=document.createElement('div'); t3.className='stats-section-title'; t3.textContent='Kisisel Rekorlar (PR)'; body.appendChild(t3);
    var prl=document.createElement('div'); prl.className='pr-list';
    prs.forEach(function(p){
      var item=document.createElement('div'); item.className='pr-item';
      var nameDiv=document.createElement('div'); nameDiv.className='pr-item-name';
      nameDiv.textContent=p.name;
      var val=document.createElement('div'); val.className='pr-item-val';
      val.textContent=p.pr.w+'kg x'+p.pr.r;
      item.appendChild(nameDiv); item.appendChild(val); prl.appendChild(item);
    });
    body.appendChild(prl);
  }

  // ── Session History
  if(log.length>0){
    var t4=document.createElement('div'); t4.className='stats-section-title'; t4.textContent='Antrenman Gecmisi'; body.appendChild(t4);
    var sl=document.createElement('div'); sl.className='sess-list';
    log.forEach(function(l){
      var item=document.createElement('div'); item.className='sess-item';
      var hdr=document.createElement('div'); hdr.className='sess-item-hdr';
      var dayDiv=document.createElement('div'); dayDiv.className='sess-item-day'; dayDiv.textContent=l.dayTag||'Antrenman';
      var dateDiv=document.createElement('div'); dateDiv.className='sess-item-date'; dateDiv.textContent=formatDateKey(l.date);
      hdr.appendChild(dayDiv); hdr.appendChild(dateDiv);
      var stats=document.createElement('div'); stats.className='sess-item-stats';
      var s1=document.createElement('div'); s1.className='sess-stat'; s1.innerHTML='Sure: <span>'+(l.duration||0)+'dk</span>';
      var s2=document.createElement('div'); s2.className='sess-stat'; s2.innerHTML='Setler: <span>'+(l.sets||0)+'</span>';
      stats.appendChild(s1); stats.appendChild(s2);
      item.appendChild(hdr); item.appendChild(stats); sl.appendChild(item);
    });
    body.appendChild(sl);
  }

  if(log.length===0 && prs.length===0){
    var empty=document.createElement('div');
    empty.style.cssText='text-align:center;color:#333;padding:40px 20px;font-size:14px;line-height:2;';
    empty.innerHTML='Henuz antrenman kaydı yok.<br>Ilk antrenmanini baslat!';
    body.appendChild(empty);
  }
}

buildHome();

</script>
